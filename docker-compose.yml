services:
  db:
    image: postgres:16-alpine
    container_name: dhatterwal-erp-pg
    restart: unless-stopped
    environment:
      POSTGRES_USER: erp
      POSTGRES_PASSWORD: erp
      POSTGRES_DB: dhatterwal_erp
    ports:
      - "5432:5432"
    volumes:
      - dhatterwal_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U erp -d dhatterwal_erp"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  dhatterwal_pgdata:
