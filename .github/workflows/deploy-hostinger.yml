# Push to main → build frontend + rsync to Hostinger VPS + pm2 reload API
# Required GitHub secrets:
#   VPS_HOST          — e.g. 187.77.129.179
#   VPS_USER          — root
#   VPS_SSH_KEY       — private key (full PEM)
#   VITE_API_URL      — MUST be empty (same-origin Nginx /api on Hostinger VPS)

name: Deploy to Hostinger VPS

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-hostinger-vps
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install + build frontend
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci --ignore-scripts
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.VPS_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H "${{ secrets.VPS_HOST }}" >> ~/.ssh/known_hosts

      - name: Rsync frontend + server + deploy configs
        run: |
          rsync -az --delete ./dist/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/dhatterwal/dist/"
          rsync -az --exclude node_modules --exclude data/pglite --exclude .env \
            ./server/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/dhatterwal/server/"
          rsync -az ./deploy/ "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}:/var/www/dhatterwal/deploy/"

      - name: Install server deps + reload PM2
        run: |
          ssh "${{ secrets.VPS_USER }}@${{ secrets.VPS_HOST }}" <<'EOF'
          set -e
          cd /var/www/dhatterwal/server
          npm ci --omit=dev
          npx prisma generate
          npx prisma db push
          cd /var/www/dhatterwal
          pm2 startOrReload deploy/ecosystem.config.cjs --update-env
          pm2 save
          EOF
