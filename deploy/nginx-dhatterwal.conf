# Nginx site — Hostinger VPS (dhatterwalsolar.com)
# Install: /etc/nginx/sites-available/dhatterwal → symlink sites-enabled
# SSL: certbot --nginx -d dhatterwalsolar.com -d www.dhatterwalsolar.com

server {
    listen 80;
    listen [::]:80;
    server_name dhatterwalsolar.com www.dhatterwalsolar.com;

    root /var/www/dhatterwal/dist;
    index index.html;

    client_max_body_size 40m;

    location /api/ {
        proxy_pass http://127.0.0.1:8787/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    location /health {
        proxy_pass http://127.0.0.1:8787/health;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|woff2?)$ {
        expires 7d;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }
}
